<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front End Agents</title>
<meta name="description" content="Local console for the design pipeline. Draws where every project has been, and lets one person release it.">
<meta name="color-scheme" content="dark light">

<!-- The thread, running through. app.js swaps in the version that stops at a
     cross tick when something needs you, so the tab strip carries the count
     on its own. Two states, exactly as the register has always had. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230B0F0E'/%3E%3Crect%20x='4'%20y='15'%20width='24'%20height='2'%20fill='%238A9691'/%3E%3C/svg%3E">

<link rel="preload" href="fonts/instrument-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">

<script>
  // Resolve the theme before first paint so the page never flashes the wrong
  // ground. Reads only localStorage and the OS preference, never state.
  //
  // The key is `handoff.theme` and it does not change. The tool is renamed on
  // screen only: renaming a storage key would silently discard the saved
  // theme and every draft of typed feedback stored beside it.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("handoff.theme"); } catch (e) { saved = null; }
    if (saved !== "light" && saved !== "dark") {
      saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>
<body>

<a class="skip" href="#board">Skip to the projects</a>

<header class="topbar">
  <div class="topbar-inner">
    <!-- The one h1 on every view. A nav wrapping a single link to the page
         you are already on is not a landmark worth having; the register of
         projects is the real one, and app.js marks it up as such. -->
    <h1 class="wordmark"><a class="wordmark-link" href="#/">Front End Agents</a></h1>
    <p class="needcount" id="needcount" aria-live="polite"></p>
  </div>
</header>

<!-- The top bar's hairline fades in when this 1px sentinel leaves the
     viewport. An IntersectionObserver, never a scroll listener. -->
<div class="scroll-sentinel" id="sentinel" aria-hidden="true"></div>

<main class="shell" id="board"></main>

<script src="app.js"></script>
</body>
</html>
