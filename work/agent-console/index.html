<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handoff</title>
<meta name="description" content="Local console for the design pipeline. Shows where it stopped, and lets one person release it.">
<meta name="color-scheme" content="dark light">
<!-- The rule, unbroken. app.js swaps in the broken-rule version when something
     is held, so the tab strip carries the held count on its own. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='4'%20fill='%230E1210'/%3E%3Crect%20x='15'%20y='4'%20width='2'%20height='24'%20fill='%237B8681'/%3E%3C/svg%3E">

<link rel="preload" href="fonts/schibsted-grotesk-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/literata-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">

<script>
  // Resolve the theme before first paint so the page never flashes the wrong
  // ground. Reads only localStorage and the OS preference, never state.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("handoff.theme"); } catch (e) { saved = null; }
    if (saved !== "light" && saved !== "dark") {
      saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>
<body>

<a class="skip" href="#board">Skip to the board</a>

<header class="topbar">
  <div class="topbar-inner">
    <!-- The one h1 on every view. A nav wrapping a single link to the page
         you are already on is not a landmark worth having; the register of
         projects is the real one, and app.js marks it up as such. -->
    <h1 class="wordmark"><a class="wordmark-link" href="#/">Handoff</a></h1>
    <p class="heldcount" id="heldcount" aria-live="polite"></p>
  </div>
</header>

<main class="shell" id="board"></main>

<script src="app.js"></script>
</body>
</html>
